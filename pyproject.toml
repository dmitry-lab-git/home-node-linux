[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-node-linux"
version = "0.1.0"
description = "Linux/WSL gateway node for the home-node ecosystem"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
